[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficsense"
version = "0.1.0"
description = "Multi-agent LLM traffic signal control for Indian urban roads (CityFlow)."
requires-python = ">=3.10,<3.12"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
perception = ["ultralytics>=8.2", "opencv-python>=4.10"]
dashboard = ["streamlit>=1.50", "plotly>=6.0"]
screenshots = ["playwright>=1.40", "pillow>=10"]   # scripts/screenshot_dashboard.py (WebP); then: python -m playwright install chromium

[tool.setuptools.packages.find]
where = ["src"]
include = ["trafficsense*"]

[tool.setuptools.package-data]
"trafficsense.dashboard" = ["assets/*", "static/fonts/*"]   # CSS theme, canvas components, bundled fonts (OFL)

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
