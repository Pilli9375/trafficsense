# Default configuration. All paths are relative to the repo root.
paths:
  external_data: data/external
  collmlight_data: data/external/collmlight
  scenarios: data/scenarios
  scenario_configs: configs/scenarios
  outputs: outputs
  runs: outputs/runs
  # IDD Detection: a gitignored symlink to the extracted dataset (it lives outside the repo,
  # on D). Create it once: ln -s <...>/IDD_Detection data/external/idd_detection
  idd_root: data/external/idd_detection
  idd_yolo: data/external/idd_yolo     # converted labels + data.yaml (gitignored, no image copies)
  idd_resized: data/external/idd_detection_640   # symlink to the resized copy on D (scripts/resize_idd.py)
  perception_outputs: outputs/perception
  # Detector training runs, weights and logs: a gitignored symlink to D (C is nearly full).
  # Create it once: ln -s /mnt/d/trafficsense/runs data/external/detector_runs
  detector_runs: data/external/detector_runs
  camera_error_model: outputs/perception/error_model.json   # scripts/eval_detector.py; camera-error experiment

scenarios:
  synthetic_4x4:
    roadnet: data/external/collmlight/Synthetic/4_4/roadnet_4_4.json
    flow: data/external/collmlight/Synthetic/4_4/anon_4_4_synthetic_8000.json
  jinan_3x4:
    roadnet: data/external/collmlight/Jinan/3_4/roadnet_3_4.json
    flow: data/external/collmlight/Jinan/3_4/anon_3_4_jinan_real_2000.json
  hangzhou_4x4:
    roadnet: data/external/collmlight/Hangzhou/4_4/roadnet_4_4.json
    flow: data/external/collmlight/Hangzhou/4_4/anon_4_4_hangzhou_real.json
  # Generated scenarios: one flow file per seed ({seed} is filled in by the env).
  indian_2x2_offpeak:
    roadnet: data/scenarios/indian_2x2/roadnet.json
    flow: data/scenarios/indian_2x2/flow_offpeak_s{seed}.json
    vehicle_types: configs/scenarios/indian_2x2.yaml   # names the vehicle types in LLM prompts
    generate_hint: run scripts/generate_indian_flow.py --level offpeak --seed <seed>
  indian_2x2_peak:
    roadnet: data/scenarios/indian_2x2/roadnet.json
    flow: data/scenarios/indian_2x2/flow_peak_s{seed}.json
    vehicle_types: configs/scenarios/indian_2x2.yaml   # names the vehicle types in LLM prompts
    generate_hint: run scripts/generate_indian_flow.py --level peak --seed <seed>
  # Same traffic with ambulances appended (configs/scenarios/indian_2x2.yaml, `emergency`).
  indian_2x2_offpeak_amb:
    roadnet: data/scenarios/indian_2x2/roadnet.json
    flow: data/scenarios/indian_2x2/flow_offpeak_amb_s{seed}.json
    vehicle_types: configs/scenarios/indian_2x2.yaml
    emergency_vehicle_type: ambulance   # tracked separately in summary.json (`emergency`)
    generate_hint: run scripts/generate_indian_flow.py --level offpeak --seed <seed> --emergency
  indian_2x2_peak_amb:
    roadnet: data/scenarios/indian_2x2/roadnet.json
    flow: data/scenarios/indian_2x2/flow_peak_amb_s{seed}.json
    vehicle_types: configs/scenarios/indian_2x2.yaml
    emergency_vehicle_type: ambulance
    generate_hint: run scripts/generate_indian_flow.py --level peak --seed <seed> --emergency

# Perception dataset prep (docs/perception.md, pre-registered).
perception:
  val_fraction: 0.10   # of official-train sequences, per camera group, held out as our val
  split_seed: 0
  imgsz: 640
  images: resized       # resized | original: which JPEGImages the YOLO image lists point to
  resize:               # scripts/resize_idd.py; originals are never modified
    long_side: 640      # = imgsz, so Ultralytics does no further resize
    jpeg_quality: 95    # high, so re-encoding adds little loss on top of the dataset's own JPEG
  train:                # scripts/train_detector.py; pre-registered in docs/perception.md section 6
    model: yolov8n.pt   # COCO-pretrained; downloaded once into paths.detector_runs/pretrained
    epochs: 50
    patience: 10        # early stop on our val fitness
    batch: 8
    amp: false          # GTX 16-series: FP16 AMP gives NaN losses
    workers: 8
    cache: false        # RAM caching needs ~20 GB
    seed: 0
    deterministic: true
    run_name: yolov8n_idd
    probe_fraction: 0.10   # probe: random share of train images (seed), 1 epoch

sim:
  steps: 3600          # default run length (CLAUDE.md)
  interval: 1.0        # seconds per simulator step
  seed: 0
  threads: 1
  lane_change: false   # CityFlow laneChange; CoLLMLight runs with true

# Signal timing enforced by the env wrapper for every controller.
# The transition (yellow) duration is NOT set here: it is read from the roadnet's
# detected transition phase (5 s in Synthetic 4x4).
signal:
  min_green: 10        # s
  max_green: 60        # s

# Emergency vehicles: what the preemption baseline and llm_guided_mp are told.
emergency:
  detection_range_m: 150   # ASSUMPTION: an ambulance on an incoming lane within this distance of
                           # the stop line is detected (lanes are 176-188 m long; at 12.5 m/s an
                           # ambulance covers 150 m in 12 s, enough for a 5 s decision step plus
                           # the 5 s transition)

controllers:
  fixedtime:
    green_time: 30     # s per green phase
    phases: paired     # the 4 opposing-approach phases that serve every non-right movement once
  fixedtime_all_phases:
    green_time: 30
    phases: all        # every green phase in the roadnet (8 in the CoLLMLight roadnets)
  fixedtime_webster:      # 4 paired phases; cycle and splits by Webster's method (control/webster.py)
    cycle_min: 60          # s
    cycle_max: 180         # s
    demand_window_s: 3600  # lane demand = vehicles in the flow file starting in [0, window)
    measurement_reps: 30   # random-order queues averaged for saturation flow / start-up loss
    measurement_seed: 0    # seed of those queue orders (not the run seed)
  maxpressure:
    decision_interval: 5   # s between re-evaluations
    min_green: 15          # s, controller's own minimum green (>= signal.min_green).
                           # Chosen by scripts/tune_maxpressure_min_green.py (docs/baselines.md)
    phases: all            # all | paired (CoLLMLight's MaxPressure uses the 4 paired phases)
    tie_break: keep_current  # keep_current | lowest_index (CoLLMLight: np.argmax -> lowest)
  llm_cooperative:         # timing and model: llm.* below
    mode: cooperative      # prompt includes each neighbour's phase and queues towards / from us
    prompt: v2             # trafficsense/llm/prompt.py
  llm_isolated:
    mode: isolated         # own intersection only
    prompt: v2
  preemption_mp:           # MaxPressure + rule-based ambulance preemption (control/preemption.py)
    decision_interval: 5   # same timing as the default MaxPressure and the LLM benchmark
    min_green: 15
    tie_break: keep_current
  llm_guided_mp:           # MaxPressure ranks the phases, the LLM picks (control/guided.py)
    mode: cooperative
    prompt: guided
    options: 2             # MaxPressure's top 2 are offered, plus keeping the current phase
    tie_break: keep_current  # MaxPressure's ranking, as controllers.maxpressure
  # Final LLM design round (Phase 3b): prompt v3 = v2 / guided plus two fixes (llm/prompt.py).
  llm_v3:
    mode: cooperative
    prompt: v3
  llm_guided_mp_v3:
    mode: cooperative
    prompt: guided_v3
    options: 2
    tie_break: keep_current
  llm_guarded_mp:          # llm_guided_mp_v3 + guard: the LLM's phase is applied only if its pressure
    mode: cooperative      # >= 0.8 x the top phase's (control/guided.py), else MaxPressure's choice
    prompt: guided_v3
    options: 2
    tie_break: keep_current
    guard_ratio: 0.8
  llm_v1:                  # the Phase 3a prompt, kept for the record. Until Phase 3b this controller
    mode: cooperative      # was called llm_cooperative (runs without a `prompt` parameter are v1)
    prompt: v1
  maxpressure_15s:         # previous default (scripts/tune_maxpressure.py), kept for comparison
    decision_interval: 15
    phases: all
    tie_break: keep_current
  maxpressure_5s:          # the original 5 s setting, kept for comparison
    decision_interval: 5
    phases: all
    tie_break: keep_current

llm:
  provider: ollama
  host: http://localhost:11434
  endpoint: /api/chat  # native endpoint, structured output via `format` (JSON schema)
  model: null          # chosen after scripts/benchmark_llm.py; must be set for LLM runs
  timeout_s: 60        # per call; a timeout counts as a failed decision
  temperature: 0
  seed: 0              # LLM sampling seed, fixed (recorded in every summary.json)
  num_ctx: 2048        # context window (tokens). Prompts are ~650; at 4096 llama3.2:3b no longer fits
                       # fully in the GTX 1650's VRAM. A prompt that could be truncated raises.
  num_predict: 128     # cap on generated tokens; the JSON answer needs about 40
  keep_alive: 30m      # keep the model loaded between calls
  decision_interval: null  # s; decided after scripts/benchmark_llm.py
  min_green: null          # s; LLM controller's own min green (>= signal.min_green)
  max_consecutive_failures: 20  # this many failed calls in a row stops the run with an error

# Hosted LLM for the exploratory model-size study only (scripts/run_model_size.py). NOT local:
# prompts leave the machine. Merged over llm.* for that arm (decision interval, min green, seed
# and max_consecutive_failures come from there). The API key is read from api_key_env, else
# from env_file (gitignored; never printed, logged or committed).
llm_hosted:
  nvidia_nim:
    provider: nvidia_nim
    base_url: https://integrate.api.nvidia.com/v1
    endpoint: /chat/completions
    model: nvidia/nemotron-3-ultra-550b-a55b
    api_key_env: NVIDIA_API_KEY
    env_file: .env
    timeout_s: 60            # per request; a timeout is a failed decision, as for Ollama
    temperature: 0
    max_tokens: 128          # same cap as llm.num_predict
    extra_body:              # reasoning off (on by default; probe: 0 reasoning characters with this)
      chat_template_kwargs: {enable_thinking: false}
    structured_output: json_schema  # OpenAI response_format (accepted; nvext.guided_json is rejected).
                                    # prompt.parse_response validates every answer either way
    rate_limit_rpm: 30       # client-side limiter, every attempt counts (probe: ~30/min sustained)
    max_retries: 5           # on HTTP 429/5xx and dropped connections; counted, not failures
    backoff_s: 2             # exponential: 2, 4, 8, ... s
    backoff_max_s: 60
