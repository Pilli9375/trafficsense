# Default configuration. All paths are relative to the repo root.
paths:
  external_data: data/external
  collmlight_data: data/external/collmlight
  scenarios: data/scenarios
  scenario_configs: configs/scenarios
  outputs: outputs
  runs: outputs/runs

scenarios:
  synthetic_4x4:
    roadnet: data/external/collmlight/Synthetic/4_4/roadnet_4_4.json
    flow: data/external/collmlight/Synthetic/4_4/anon_4_4_synthetic_8000.json

sim:
  steps: 3600          # default run length (CLAUDE.md)
  interval: 1.0        # seconds per simulator step
  seed: 0
  threads: 1

# Signal timing enforced by the env wrapper for every controller.
# The transition (yellow) duration is NOT set here: it is read from the roadnet's
# detected transition phase (5 s in Synthetic 4x4).
signal:
  min_green: 10        # s
  max_green: 60        # s

controllers:
  fixedtime:
    green_time: 30     # s per green phase
  maxpressure:
    decision_interval: 5   # s between re-evaluations; switches only once min_green is met

llm:
  provider: ollama
  host: http://localhost:11434
  endpoint: /api/chat  # native endpoint, structured output via `format`
  model: null          # chosen after scripts/benchmark_llm.py; must be set for LLM runs
  decision_interval: null  # decided in Phase 3
